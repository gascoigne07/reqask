name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Tests
        # Ключей нет: модель в тестах подменена заглушкой, сеть не нужна.
        run: uv run --python ${{ matrix.python-version }} pytest -q
