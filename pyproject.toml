[project]
name = "reqask"
version = "0.1.0"
description = "ИИ-агент статической проверки документа требований по ISO/IEC/IEEE 29148 и IEEE 830"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Явно ради pdfminer (pdfplumber): без fonttools он пишет поток предупреждений о шрифтах при чтении PDF.
    "fonttools>=4.65.0",
    # Верхняя граница по мажорной версии из uv.lock (3.59): путь через venv без lock не возьмёт 4.x.
    "openai>=1.40,<4",
    "pdfplumber>=0.11.10",
    "pydantic>=2.6",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[project.scripts]
reqask = "reqask.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reqask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
